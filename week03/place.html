<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A webpage about Zimbabwe">
    <meta name="author" content="Victor Mtisi">

    <title>Zimbabwe Place Page</title>

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Zimbabwe</h1>
    </header>

    <main>

        <!-- Hero Section -->
        <section class="hero">

            <picture>
                <source media="(min-width: 768px)"
                    srcset="images/zimbabwe-large.webp">

                <img src="images/zimbabwe-small.webp"
                    alt="Beautiful view of Zimbabwe">
            </picture>

        </section>

        <!-- Data Section -->
        <section class="data">
            <h2>Data</h2>

            <p><strong>Capital:</strong> Harare</p>
            <p><strong>Population:</strong> 16 million+</p>
            <p><strong>Language:</strong> English, Shona, Ndebele</p>
            <p><strong>Currency:</strong> Zimbabwe Gold (ZiG)</p>
            <p><strong>Time Zone:</strong> CAT</p>
        </section>

        <!-- Weather Section -->
        <section class="weather">

            <h2>
                Weather
                <span class="weather.svg">⛅</span>
            </h2>

            <img src="images/weather.svg"
                alt="Weather Icon"
                class="mobile-weather-icon">

            <p><strong>Temperature:</strong> 24°C</p>
            <p><strong>Conditions:</strong> Partly Cloudy</p>
            <p><strong>Wind:</strong> 10 km/h</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>

        </section>

    </main>

    <footer>
        <p>
            &copy; <span id="year"></span> Victor Mtisi | Zimbabwe
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
