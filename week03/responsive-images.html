<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Images — Week 03</title>
  <link rel="stylesheet" href="styles/responsive-images.css" />
</head>
<body>
  <main>
    <div class="hero">
      <picture>
        <!-- Large image used at viewport widths >= 1000px -->
        <source media="(min-width: 1000px)" srcset="images/hero-large.webp">

        <!-- Medium image used at viewport widths >= 500px -->
        <source media="(min-width: 500px)" srcset="images/hero-medium.webp">

        <!-- Fallback/small image for narrower viewports -->
        <img src="images/hero-small.webp"
             alt="Jordan Temple in the evening light"
             width="500" height="313">
      </picture>
    </div>
  </main>
</body>
</html>
