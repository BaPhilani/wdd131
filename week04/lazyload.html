<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Loading Images</title>

    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>

    <main>
        <h1>Lazy Loading Image Gallery</h1>

        <img src="https://www.shopify.com/stock-photos/photos/vibrant-red-and-blue-bird-on-a-branch?c=bird"
             alt="Random landscape 1"
             width="400"
             height="650"
             loading="lazy">

        <img src="https://www.shopify.com/stock-photos/photos/black-and-red-chicken?c=bird"
             alt="Random landscape 2"
             width="400"
             height="660"
             loading="lazy">

        <img src="https://www.shopify.com/stock-photos/photos/vibrant-red-and-blue-bird-on-a-branch?c=bird"
             alt="Random landscape 3"
             width="400"
             height="670"
             loading="lazy">

        <img src="https://www.shopify.com/stock-photos/photos/catching-a-white-crane-in-flight?c=bird"
             alt="Random landscape 4"
             width="400"
             height="680"
             loading="lazy">

        <img src="https://www.shopify.com/stock-photos/photos/songbird-among-the-cherry-blossoms?c=bird"
             alt="Random landscape 5"
             width="400"
             height="690"
             loading="lazy">

        <img src="https://www.shopify.com/stock-photos/photos/two-brown-birds-mid-flight-against-a-blue-sky?c=bird"
             alt="Random landscape 6"
             width="400"
             height="700"
             loading="lazy">
    </main>

    <footer>
        <p>&copy; 2026 Victor Mtisi</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
